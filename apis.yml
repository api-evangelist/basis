  note: >-
    Corrected from onboarding "self-serve" on 2026-08-13. Basis's own API
    documentation states the opposite — "The Basis API is available to Centro
    customers and integration partners, and all organizations must acquire valid
    credentials prior to using the web services. Contact your Centro
    representative to obtain valid credentials." Redirect-URI registration and
    owner/agency-ID assignment are also handled by a Basis representative.
    https://platform.basis.net/auth/login is a sign-in for existing customers,
    not a developer sign-up.
