                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identifies a single property.
                      name:
                        type: string
                      type:
                        type: string
                      url:
                        type:
                        - 'null'
                        - string
                      created_at:
                        type: string
                      verticals:
                        type: array
                        items:
                          type: string
                          description: Identifies a single vertical.
                  included:
                    type: object
                    properties:
                      verticals:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            created_at:
                              type: string
