        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identifies a single client.
                      name:
                        type: string
                      billing_name:
                        type:
                        - 'null'
                        - string
                      contact_first_name:
                        type:
                        - 'null'
                        - string
                      contact_last_name:
                        type:
                        - 'null'
                        - string
                      contact_email:
                        type:
                        - 'null'
                        - string
                      contact_phone:
                        type:
                        - 'null'
                        - string
                      contact_extension:
                        type:
                        - 'null'
                        - string
                      notes:
                        type:
                        - 'null'
                        - string
                      created_at:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                description: Client not found
                type: object
                properties: {}
      summary: Get clients by id
      x-summary-source: derived
      operationId: getV1ClientsById
      x-operation-id-source: derived
  /v1/clients:
    get:
      tags:
      - Analytics
      description: Lists all clients.
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Used to paginate through the list of records. Don't set this parameter to see the first page of records, then check the metadata object in the response for the cursor to use to fetch the next page.
      - schema:
          type: string
        in: query
        name: query
        required: false
        description: Used to refine the results by a chosen parameter. Valid parameters are name, contact_first_name, contact_last_name, contact_email, billing_name, notes
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
