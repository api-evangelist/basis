          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Property not found
          content:
            application/json:
              schema:
                description: Property not found
                type: object
                properties: {}
      summary: Get properties by id
      x-summary-source: derived
      operationId: getV1PropertiesById
      x-operation-id-source: derived
