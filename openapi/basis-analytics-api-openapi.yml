      x-summary-source: derived
      operationId: getV1CampaignsById
      x-operation-id-source: derived
  /v1/campaigns:
    get:
      tags:
      - Analytics
      description: Lists all campaigns.
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Used to paginate through the list of records. Don't set this parameter to see the first page of records, then check the metadata object in the response for the cursor to use to fetch the next page.
      - schema:
          type: string
        in: query
        name: query
        required: false
        description: Used to refine the results by a chosen parameter. Valid parameters are name, ugcid, initiative_name
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[34][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        in: query
        name: client_id
        required: false
        description: Identifies a single client. Set this parameter to limit the campaigns to the specified client.
      - schema:
          type: string
          enum:
          - live
          - approved
          - completed
        in: query
        name: status
        required: false
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
