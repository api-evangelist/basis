  /v1/campaigns/{id}:
    get:
      tags:
      - Analytics
      description: Returns details for a single campaign.
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[34][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        in: path
        name: id
        required: true
        description: Identifies a single campaign.
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identifies a single campaign.
                      name:
                        type: string
                      ugcid:
                        type: string
                      initiative_name:
                        type: string
                      status:
                        type: string
                      approved_budget:
                        type: number
                      start_date:
                        type:
                        - 'null'
                        - string
                      end_date:
                        type:
                        - 'null'
                        - string
                      client_id:
                        type: string
                        description: Identifies a single client.
                      brand_id:
                        type: string
                        description: Identifies a single brand.
                      created_at:
                        type: string
                      objectives:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Identifies a single objective.
                            name:
                              type: string
                            kpi_name:
                              type: string
                            goal:
                              type: number
                            other_objective_type_description:
                              type:
                              - 'null'
                              - string
                            other_kpi_description:
                              type:
                              - 'null'
                              - string
                            created_at:
                              type: string
                      account_team:
                        type: array
                        items:
                          type: string
                          description: Identifies a single user on the account team.
                  included:
                    type: object
                    properties:
                      account_team_users:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            email:
                              type: string
                            created_at:
                              type: string
