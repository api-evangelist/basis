openapi: 3.2.0
info:
  title: Basis Platform Analytics API
  version: v1
  description: '# Introduction


    The Basis API is designed to be easy to use and simple to test to help customers

    and partners get up and running quickly.'
servers:
- url: https://api.basis.net
tags:
- name: Analytics
paths:
  /v1/me:
    get:
      tags:
      - Analytics
      description: Returns the currently authenticated user
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                description: User not found
                type: object
                properties: {}
      summary: Get me
      x-summary-source: derived
      operationId: getV1Me
      x-operation-id-source: derived
  /v1/agency:
    get:
      tags:
      - Analytics
      description: Returns details for the agency, the organization representing a buyer.
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      dsp_advertiser_id:
                        type: string
                      created_at:
                        type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
      summary: Get agency
      x-summary-source: derived
      operationId: getV1Agency
      x-operation-id-source: derived
  /v1/brands/{id}:
    get:
      tags:
      - Analytics
      description: Returns details for one brand.
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[34][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        in: path
        name: id
        required: true
        description: Identifies a single brand.
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identifies a single brand.
                      name:
                        type: string
                        description: The name of the brand.
                      created_at:
                        type: string
                      verticals:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Identifies a single vertical.
                            name:
                              type: string
                              description: The name of the vertical.
                            created_at:
                              type: string
                              description: The date and time the vertical was added.
                            subverticals:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Identifies a single sub-vertical.
                                  name:
                                    type: string
                                    description: The name of the sub-vertical.
                                  created_at:
                                    type: string
                                    description: The date and time the sub-vertical was added.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                description: Brand not found
                type: object
                properties: {}
      summary: Get brands by id
      x-summary-source: derived
      operationId: getV1BrandsById
      x-operation-id-source: derived
  /v1/brands:
    get:
      tags:
      - Analytics
      description: Lists all brands.
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Used to paginate through the list of records. Don't set this parameter to see the first page of records, then check the metadata object in the response for the cursor to use to fetch the next page.
      - schema:
          type: string
        in: query
        name: query
        required: false
        description: Used to refine the results by a chosen parameter. Valid parameters = name
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[34][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        in: query
        name: client_id
        required: false
        description: Identifies a single client. Set this parameter to limit the brands to the specified client.
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      cursor:
                        type:
                        - 'null'
                        - string
                        description: Use this cursor value in your next call to this endpoint to return the next set of items
                      page_size:
                        type: integer
                      total:
                        type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Identifies a single brand.
                        name:
                          type: string
                          description: The name of the brand.
                        created_at:
                          type: string
                        verticals:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Identifies a single vertical.
                              name:
                                type: string
                                description: The name of the vertical.
                              created_at:
                                type: string
                                description: The date and time the vertical was added.
                              subverticals:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Identifies a single sub-vertical.
                                    name:
                                      type: string
                                      description: The name of the sub-vertical.
                                    created_at:
                                      type: string
                                      description: The date and time the sub-vertical was added.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
      summary: Get brands
      x-summary-source: derived
      operationId: getV1Brands
      x-operation-id-source: derived
  /v1/clients/{id}:
    get:
      tags:
      - Analytics
      description: Returns details for one client. An agency can represent multiple clients, and each client can have multiple brands.
      parameters:
