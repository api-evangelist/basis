                      page_size:
                        type: integer
                      total:
                        type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Identifies a single client.
                        name:
                          type: string
                        billing_name:
                          type:
                          - 'null'
                          - string
                        contact_first_name:
                          type:
                          - 'null'
                          - string
                        contact_last_name:
                          type:
                          - 'null'
                          - string
                        contact_email:
                          type:
                          - 'null'
                          - string
                        contact_phone:
                          type:
                          - 'null'
                          - string
                        contact_extension:
                          type:
                          - 'null'
                          - string
                        notes:
                          type:
                          - 'null'
                          - string
                        created_at:
                          type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
      summary: Get clients
      x-summary-source: derived
      operationId: getV1Clients
      x-operation-id-source: derived
  /v1/vendors/{id}:
    get:
      tags:
      - Analytics
      description: Returns details for one vendor, an entity or organization selling and offering products, content, or services for payment. Examples of vendors would include the owners of websites that offer advertisement space and exchanges that offers ad space on multiple websites.
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[34][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        in: path
        name: id
        required: true
        description: Identifies a single vendor.
      security:
      - Bearer: []
        OAuth2: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                description: Successful Response
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Identifies a single vendor.
                      name:
                        type: string
                      type:
                        type: string
                      created_at:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                description: Bad Request
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Vendor not found
          content:
            application/json:
              schema:
                description: Vendor not found
                type: object
                properties: {}
      summary: Get vendors by id
      x-summary-source: derived
      operationId: getV1VendorsById
      x-operation-id-source: derived
  /v1/vendors:
    get:
      tags:
      - Analytics
      description: Lists all vendors, entities or organizations selling and offering products, content, or services for payment. Examples of vendors would include the owners of websites that offer advertisement space and exchanges that offers ad space on multiple websites.
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Used to paginate through the list of records. Don't set this parameter to see the first page of records, then check the metadata object in the response for the cursor to use to fetch the next page.
      - schema:
          type: string
        in: query
        name: query
